<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Snowball Frenzy</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app" class="app">
      <canvas id="game" class="game" width="960" height="540"></canvas>

      <div class="hud">
        <div class="hud-left">
          <div class="badge">☃️ SNOWBALL FRENZY</div>
          <div class="stats">
            <div class="stat"><span>Score</span><b id="uiScore">0</b></div>
            <div class="stat"><span>Time</span><b id="uiTime">30</b></div>
            <div class="stat"><span>Streak</span><b id="uiStreak">0</b></div>
          </div>
        </div>
        <div class="hud-right">
          <button id="btnSound" class="btn">🔊 Sound</button>
          <button id="btnRestart" class="btn">↻ Restart</button>
          <button id="btnExitFs" class="btn">⤢ Exit</button>
        </div>
      </div>

      <div id="overlay" class="overlay">
        <div class="panel">
          <h1>Tap to Start</h1>
          <p class="muted">Hold to charge • release to throw • drag to aim</p>
          <button id="btnStart" class="btn primary">Start</button>
          <p class="tiny muted">Fullscreen will start after tap (browser rule)</p>
        </div>
      </div>

      <div id="gameover" class="overlay hidden">
        <div class="panel">
          <h1>Frenzy Complete</h1>
          <p class="muted">Final score: <b id="uiFinal">0</b></p>
          <div class="row">
            <button id="btnSend" class="btn primary">Send Score</button>
            <button id="btnPlayAgain" class="btn">Play Again</button>
          </div>
          <p class="tiny muted">Score will be posted to Winter Arcade.</p>
        </div>
      </div>
    </div>

    <script src="./game.js" defer></script>
  </body>
</html>
